services:
  bumper-brawl:
    build: .
    image: bumper-brawl:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?set HOST_PORT in .env}:8080"
    environment:
      MIN_PLAYERS: ${MIN_PLAYERS:-4}
      ROUND_SECONDS: ${ROUND_SECONDS:-120}
      MATCH_ROUNDS: ${MATCH_ROUNDS:-5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
